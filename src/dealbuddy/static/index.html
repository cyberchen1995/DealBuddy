<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DealBuddy 购物搭子，本地购物研究工作台。"
    />
    <link rel="icon" href="data:," />
    <title>DealBuddy 工作台</title>
    <style>
      /* 柔和亲和风:奶油底大圆角 + 陶土橘主色 + 蜜琥珀价格贴纸。
         token 规范见 docs/design/tokens.md;底稿 docs/design/explorations/2026-08-r1(方向 2)。 */
      :root {
        color-scheme: light;
        --db-bg: #faf6f0;
        --db-surface: #ffffff;
        --db-surface-soft: #f5efe6;
        --db-surface-raised: #fffdf9;
        --db-line: #ece3d6;
        --db-line-strong: #ddd1bf;
        --db-text: #40382e;
        --db-muted: #8f8577;
        --db-muted-strong: #6b6154;
        --db-accent: #d97757;
        --db-accent-strong: #c2603f;
        --db-accent-soft: #f9e9e1;
        --db-on-accent: #fffdf9;
        --db-link: #ad5230;
        --db-warn: #c99036;
        --db-warn-strong: #8a5c14;
        --db-warn-soft: #f7edd8;
        --db-danger: #c65f5f;
        --db-danger-strong: #a84848;
        --db-danger-soft: #f7e5e5;
        --db-shadow: rgba(94, 72, 45, 0.1);
        --db-shadow-deep: rgba(94, 72, 45, 0.17);
        --db-ring: rgba(94, 72, 45, 0);
        --db-glow: rgba(217, 119, 87, 0.06);
        --db-radius-s: 12px;
        --db-radius-m: 20px;
        --db-radius-l: 28px;
        --db-font-body:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          sans-serif;
        --db-font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      /* 暗色:深夜暖灯书房,不发蓝。
         三态主题:跟随系统(media query,手动选浅色时被 :not 排除)+ 手动深色([data-theme])。
         两个块的变量必须逐值一致,改一处必须同步另一处。 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --db-bg: #211d18;
          --db-surface: #2b2620;
          --db-surface-soft: #332d26;
          --db-surface-raised: #2f2a23;
          --db-line: rgba(228, 208, 180, 0.14);
          --db-line-strong: rgba(228, 208, 180, 0.28);
          --db-text: #ede5d8;
          --db-muted: #a99c8a;
          --db-muted-strong: #c6b8a4;
          --db-accent: #e08b6d;
          --db-accent-strong: #ea9c81;
          --db-accent-soft: rgba(224, 139, 109, 0.18);
          --db-on-accent: #241a12;
          --db-link: #eb9a7c;
          --db-warn: #e0aa5c;
          --db-warn-strong: #ecc287;
          --db-warn-soft: rgba(224, 170, 92, 0.16);
          --db-danger: #d98080;
          --db-danger-strong: #e39a9a;
          --db-danger-soft: rgba(217, 128, 128, 0.16);
          --db-shadow: rgba(10, 7, 4, 0.45);
          --db-shadow-deep: rgba(10, 7, 4, 0.6);
          --db-ring: rgba(228, 208, 180, 0.1);
          --db-glow: rgba(224, 139, 109, 0.05);
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --db-bg: #211d18;
        --db-surface: #2b2620;
        --db-surface-soft: #332d26;
        --db-surface-raised: #2f2a23;
        --db-line: rgba(228, 208, 180, 0.14);
        --db-line-strong: rgba(228, 208, 180, 0.28);
        --db-text: #ede5d8;
        --db-muted: #a99c8a;
        --db-muted-strong: #c6b8a4;
        --db-accent: #e08b6d;
        --db-accent-strong: #ea9c81;
        --db-accent-soft: rgba(224, 139, 109, 0.18);
        --db-on-accent: #241a12;
        --db-link: #eb9a7c;
        --db-warn: #e0aa5c;
        --db-warn-strong: #ecc287;
        --db-warn-soft: rgba(224, 170, 92, 0.16);
        --db-danger: #d98080;
        --db-danger-strong: #e39a9a;
        --db-danger-soft: rgba(217, 128, 128, 0.16);
        --db-shadow: rgba(10, 7, 4, 0.45);
        --db-shadow-deep: rgba(10, 7, 4, 0.6);
        --db-ring: rgba(228, 208, 180, 0.1);
        --db-glow: rgba(224, 139, 109, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background-color: var(--db-bg);
        background-image: radial-gradient(1100px 460px at 14% -10%, var(--db-glow), var(--db-bg) 62%);
        background-repeat: no-repeat;
        color: var(--db-text);
        font-family: var(--db-font-body);
        font-size: 14.5px;
        font-weight: 400;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1,
      h2,
      h3,
      h4 {
        font-weight: 600;
        line-height: 1.35;
      }

      h1 {
        font-size: 22px;
      }

      h2 {
        font-size: 16px;
      }

      h3,
      h4 {
        font-size: 13.5px;
      }

      strong {
        font-weight: 600;
      }

      ::selection {
        background: var(--db-accent-soft);
      }

      a {
        color: var(--db-link);
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-decoration-color: var(--db-line-strong);
        text-underline-offset: 3px;
      }

      a:hover {
        color: var(--db-accent-strong);
        text-decoration-color: var(--db-accent);
      }

      a:focus-visible {
        border-radius: 4px;
        outline: 2px solid var(--db-accent-strong);
        outline-offset: 2px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      input,
      textarea,
      summary,
      a,
      .session-item,
      .offer-card,
      .status-chip {
        transition:
          background-color 200ms ease,
          color 200ms ease,
          border-color 200ms ease,
          box-shadow 200ms ease,
          transform 200ms ease,
          text-decoration-color 200ms ease;
      }

      /* ---------- 按钮(胶囊) ---------- */
      button {
        align-items: center;
        background: var(--db-accent);
        border: none;
        border-radius: 999px;
        box-shadow: 0 4px 12px var(--db-shadow);
        color: var(--db-on-accent);
        cursor: pointer;
        display: inline-flex;
        font-size: 13.5px;
        font-weight: 600;
        justify-content: center;
        min-height: 36px;
        padding: 8px 20px;
        white-space: nowrap;
      }

      button:hover:not(:disabled) {
        background: var(--db-accent-strong);
        box-shadow: 0 8px 18px var(--db-shadow-deep);
        transform: translateY(-1px);
      }

      button:active:not(:disabled) {
        box-shadow: 0 2px 6px var(--db-shadow);
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 2px solid var(--db-accent-strong);
        outline-offset: 2px;
      }

      button:disabled {
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      button.secondary {
        background: var(--db-surface-soft);
        box-shadow: none;
        color: var(--db-muted-strong);
      }

      button.secondary:hover:not(:disabled) {
        background: var(--db-line);
        box-shadow: 0 4px 12px var(--db-shadow);
        color: var(--db-text);
      }

      button.danger {
        background: var(--db-danger-soft);
        box-shadow: none;
        color: var(--db-danger-strong);
      }

      /* hover 白字 3.97:1:已知例外(tokens.md),按钮组件线内 */
      button.danger:hover:not(:disabled) {
        background: var(--db-danger);
        box-shadow: 0 6px 16px var(--db-shadow-deep);
        color: var(--db-on-accent);
      }

      button.danger:focus-visible {
        outline-color: var(--db-danger);
      }

      /* busy 态预留给 X6 加载体系;JS 目前用文字替换 + disabled */
      button.busy {
        animation: db-breathe 1.6s ease-in-out infinite;
        box-shadow: none;
        cursor: progress;
        opacity: 1;
      }

      @keyframes db-breathe {
        0%,
        100% {
          opacity: 0.95;
        }

        50% {
          opacity: 0.55;
        }
      }

      /* ---------- 输入 ---------- */
      input,
      textarea {
        background: var(--db-surface-soft);
        border: 2px solid var(--db-surface-soft);
        border-radius: var(--db-radius-s);
        color: var(--db-text);
        min-width: 0;
        padding: 8px 12px;
        width: 100%;
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--db-muted);
      }

      input:hover,
      textarea:hover {
        border-color: var(--db-line-strong);
      }

      input:focus,
      textarea:focus,
      input:focus-visible,
      textarea:focus-visible {
        background: var(--db-surface);
        border-color: var(--db-accent);
        box-shadow: 0 0 0 4px var(--db-accent-soft);
        outline: none;
      }

      input:disabled,
      textarea:disabled {
        border-color: var(--db-surface-soft);
        cursor: not-allowed;
        opacity: 0.55;
      }

      textarea {
        min-height: 82px;
        resize: vertical;
      }

      input[type="checkbox"] {
        accent-color: var(--db-accent);
        flex: 0 0 auto;
        height: 16px;
        width: 16px;
      }

      /* ---------- 页头 ---------- */
      .app-header {
        backdrop-filter: blur(12px);
        background: color-mix(in srgb, var(--db-bg) 88%, transparent);
        border-bottom: 1px solid var(--db-line);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .header-inner {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin: 0 auto;
        max-width: 1500px;
        min-height: 76px;
        padding: 12px 24px;
      }

      .brand {
        min-width: 260px;
      }

      .brand-name {
        align-items: center;
        color: var(--db-accent-strong);
        display: flex;
        font-size: 13px;
        font-weight: 600;
        gap: 8px;
        letter-spacing: 0.05em;
        margin: 0 0 2px;
      }

      .brand-name::before {
        background: var(--db-accent);
        border-radius: 50%;
        box-shadow: 0 0 0 4px var(--db-accent-soft);
        content: "";
        flex: none;
        height: 8px;
        width: 8px;
      }

      .header-copy {
        color: var(--db-muted-strong);
        font-size: 13px;
        margin-top: 4px;
        max-width: 58ch;
      }

      .status-row {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .status-chip {
        align-items: center;
        background: var(--db-surface);
        border-radius: 999px;
        box-shadow: 0 2px 8px var(--db-shadow), 0 0 0 1px var(--db-ring);
        color: var(--db-muted-strong);
        display: inline-flex;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        gap: 8px;
        min-height: 30px;
        padding: 4px 12px;
        white-space: nowrap;
      }

      .status-chip::before {
        background: var(--db-accent);
        border-radius: 50%;
        content: "";
        flex: none;
        height: 6px;
        width: 6px;
      }

      .status-chip.warning {
        background: var(--db-warn-soft);
        color: var(--db-warn-strong);
      }

      .status-chip.warning::before {
        background: var(--db-warn);
      }

      /* 主题三态切换(自动/浅色/深色) */
      .theme-switch {
        align-items: center;
        background: var(--db-surface-soft);
        border-radius: 999px;
        box-shadow: inset 0 0 0 1px var(--db-ring);
        display: inline-flex;
        gap: 2px;
        padding: 3px;
      }

      .theme-switch button {
        background: transparent;
        border-radius: 999px;
        box-shadow: none;
        color: var(--db-muted);
        font-size: 12px;
        font-weight: 600;
        min-height: 24px;
        padding: 2px 10px;
      }

      .theme-switch button:hover:not(:disabled) {
        background: var(--db-line);
        box-shadow: none;
        color: var(--db-text);
        transform: none;
      }

      .theme-switch button[aria-pressed="true"] {
        background: var(--db-surface);
        box-shadow: 0 2px 6px var(--db-shadow);
        color: var(--db-accent-strong);
      }

      /* ---------- 三栏骨架与面板 ---------- */
      .workspace {
        align-items: start;
        display: grid;
        gap: 20px;
        grid-template-columns:
          minmax(270px, 318px)
          minmax(470px, 1fr)
          minmax(360px, 440px);
        margin: 0 auto;
        max-width: 1500px;
        padding: 20px 24px 32px;
      }

      .panel {
        background: var(--db-surface);
        border-radius: var(--db-radius-m);
        box-shadow: 0 10px 30px var(--db-shadow), 0 0 0 1px var(--db-ring);
        min-width: 0;
        overflow: hidden;
      }

      .panel-head {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        min-height: 56px;
        padding: 20px 20px 0;
      }

      .panel-head button {
        font-size: 13px;
        min-height: 32px;
        padding: 6px 16px;
      }

      .panel-head .status-chip {
        margin-top: 2px;
      }

      .panel-title {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .panel-title h2::after {
        background: var(--db-accent-soft);
        border-radius: 999px;
        content: "";
        display: block;
        height: 5px;
        margin-top: 6px;
        width: 26px;
      }

      .panel-body {
        display: grid;
        gap: 16px;
        padding: 16px 20px 20px;
      }

      .sidebar-body {
        gap: 16px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      /* ---------- 表单区块 ---------- */
      .session-form {
        background: var(--db-surface-soft);
        border-radius: var(--db-radius-s);
        gap: 12px;
        padding: 12px;
      }

      /* soft 底容器(会话表单/LLM 设置区)内输入框反转为白底,避免与容器同色融合 */
      .session-form input,
      .session-form textarea,
      .disclosure-body input,
      .disclosure-body textarea {
        background: var(--db-surface);
        border-color: var(--db-surface);
      }

      .session-form input:hover,
      .session-form textarea:hover,
      .disclosure-body input:hover,
      .disclosure-body textarea:hover {
        border-color: var(--db-line-strong);
      }

      .session-form input:focus,
      .session-form textarea:focus,
      .session-form input:focus-visible,
      .session-form textarea:focus-visible,
      .disclosure-body input:focus,
      .disclosure-body textarea:focus,
      .disclosure-body input:focus-visible,
      .disclosure-body textarea:focus-visible {
        border-color: var(--db-accent);
      }

      .session-form .form-actions {
        justify-content: stretch;
      }

      .session-form button {
        width: 100%;
      }

      .field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .field label,
      .label-text {
        color: var(--db-muted-strong);
        font-size: 12.5px;
        font-weight: 600;
      }

      .helper,
      .muted {
        color: var(--db-muted);
        font-size: 12.5px;
      }

      .form-actions,
      .inline-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .inline-actions button {
        font-size: 13px;
        min-height: 32px;
        padding: 6px 16px;
      }

      /* ---------- 会话列表 ---------- */
      .session-list {
        display: grid;
        gap: 8px;
        max-height: 34vh;
        overflow: auto;
        padding-right: 2px;
      }

      .session-item {
        background: var(--db-surface-soft);
        border-radius: var(--db-radius-s);
        box-shadow: none;
        color: var(--db-text);
        display: grid;
        font-weight: 400;
        gap: 4px;
        justify-content: stretch;
        min-height: auto;
        padding: 10px 12px;
        text-align: left;
        white-space: normal;
        width: 100%;
      }

      .session-item:hover:not(:disabled) {
        background: var(--db-line);
        box-shadow: 0 6px 14px var(--db-shadow);
        color: var(--db-text);
        transform: translateY(-1px);
      }

      .session-item.active,
      .session-item.active:hover:not(:disabled) {
        background: var(--db-accent-soft);
      }

      .session-item.active strong {
        color: var(--db-accent-strong);
      }

      .session-item strong {
        font-size: 13.5px;
        line-height: 1.35;
      }

      .session-meta {
        color: var(--db-muted);
        display: flex;
        flex-wrap: wrap;
        font-family: var(--db-font-mono);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        gap: 8px;
      }

      /* ---------- 折叠区(LLM 设置;X8 轮将弹窗化) ---------- */
      summary {
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::marker {
        content: "";
      }

      summary:focus-visible {
        border-radius: var(--db-radius-s);
        outline: 2px solid var(--db-accent-strong);
        outline-offset: -2px;
      }

      .disclosure {
        background: var(--db-surface-soft);
        border-radius: var(--db-radius-s);
        min-width: 0;
        overflow: hidden;
      }

      .disclosure-summary {
        align-items: flex-start;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 12px;
      }

      .disclosure-summary:hover {
        background: var(--db-line);
      }

      .llm-summary {
        align-items: stretch;
        display: block;
        padding: 12px;
      }

      .summary-copy {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .settings-title-row {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
        min-width: 0;
      }

      .settings-title-row strong {
        font-size: 13.5px;
      }

      .summary-action {
        background: var(--db-accent-soft);
        border-radius: 999px;
        color: var(--db-link);
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 12px;
      }

      .summary-status {
        color: var(--db-muted);
        font-size: 12.5px;
        line-height: 1.4;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .disclosure-body {
        display: grid;
        gap: 12px;
        min-width: 0;
        padding: 4px 12px 12px;
      }

      .privacy-note {
        color: var(--db-muted);
        font-size: 12.5px;
        line-height: 1.5;
      }

      .privacy-note.warning {
        color: var(--db-warn-strong);
      }

      .toggle-row {
        align-items: flex-start;
        background: var(--db-surface);
        border-radius: var(--db-radius-s);
        display: flex;
        gap: 8px;
        padding: 10px 12px;
      }

      .toggle-copy {
        display: grid;
        gap: 2px;
      }

      .field-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
        min-width: 0;
      }

      .provider-grid {
        grid-template-columns: 1fr;
      }

      .field-grid .wide {
        grid-column: 1 / -1;
      }

      /* ---------- 提示与语义色 ---------- */
      .notice {
        background: var(--db-surface-soft);
        border-radius: var(--db-radius-s);
        color: var(--db-muted-strong);
        font-size: 12.5px;
        line-height: 1.55;
        padding: 10px 12px;
      }

      .notice:empty {
        display: none;
      }

      .notice.error {
        background: var(--db-danger-soft);
        color: var(--db-danger-strong);
      }

      .warning {
        color: var(--db-warn-strong);
      }

      .error {
        color: var(--db-danger-strong);
      }

      /* ---------- 分析与追问 ---------- */
      .analysis-stack {
        display: grid;
        gap: 16px;
      }

      .report {
        background: var(--db-surface-raised);
        border-radius: var(--db-radius-s);
        box-shadow: 0 6px 18px var(--db-shadow), 0 0 0 1px var(--db-ring);
        max-height: 460px;
        min-height: 210px;
        overflow: auto;
        padding: 16px 20px;
      }

      .markdown-content {
        color: var(--db-text);
        font-variant-numeric: tabular-nums;
        line-height: 1.65;
        overflow-wrap: break-word;
      }

      .markdown-content h1,
      .markdown-content h2,
      .markdown-content h3 {
        color: var(--db-text);
        margin: 0 0 8px;
      }

      .markdown-content h1 {
        font-size: 17px;
      }

      .markdown-content h2 {
        align-items: center;
        display: flex;
        font-size: 14.5px;
        gap: 8px;
        margin-top: 16px;
      }

      .markdown-content h2::before {
        background: var(--db-accent);
        border-radius: 50%;

    <script>
      const state = {
        sessions: [],
        currentSessionId: null,
        currentSession: null,
        chatStreaming: false,
        reportRegenerating: false,
      };

      const $ = (id) => document.getElementById(id);

      // 主题三态:auto 跟随系统,light/dark 手动覆盖;选择存 localStorage。
      const THEME_KEY = "dealbuddy.theme";

      function applyTheme(choice) {
        if (choice === "light" || choice === "dark") {
          document.documentElement.dataset.theme = choice;
        } else {
          delete document.documentElement.dataset.theme;
        }
        for (const button of document.querySelectorAll("[data-theme-choice]")) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.themeChoice === choice),
          );
        }
      }

      function initTheme() {
        let saved = null;
        try {
          saved = localStorage.getItem(THEME_KEY);
        } catch {
          /* localStorage 不可用时按跟随系统处理 */
        }
        applyTheme(saved === "light" || saved === "dark" ? saved : "auto");
        for (const button of document.querySelectorAll("[data-theme-choice]")) {
          button.addEventListener("click", () => {
            const next = button.dataset.themeChoice;
            try {
              if (next === "auto") {
                localStorage.removeItem(THEME_KEY);
              } else {
                localStorage.setItem(THEME_KEY, next);
              }
            } catch {
              /* 存不进就只影响本次会话 */
            }
            applyTheme(next);
          });
        }
      }

      initTheme();

      function text(value, fallback = "") {
        return value === null || value === undefined || value === ""
          ? fallback
          : String(value);
      }

      function escapeHtml(value) {
        return text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function safeUrl(value) {
        try {
          const url = new URL(text(value), window.location.href);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "#";
        } catch {
          return "#";
        }
      }

      function lineBreaks(value) {
        return escapeHtml(value).replaceAll("\n", "<br>");
      }

      function renderInlineMarkdown(value) {
        const source = text(value);
        const pattern = /\[([^\]]+)\]\(([^)]+)\)/g;
        let result = "";
        let lastIndex = 0;
        for (const match of source.matchAll(pattern)) {
          result += escapeHtml(source.slice(lastIndex, match.index));
          const href = safeUrl(match[2]);
          result += `<a href="${escapeHtml(href)}" target="_blank" rel="noreferrer">${escapeHtml(match[1])}</a>`;
          lastIndex = match.index + match[0].length;
        }
        result += escapeHtml(source.slice(lastIndex));
        return result
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      }

      function renderMarkdown(markdown) {
        const source = text(markdown).trim();
        if (!source) {
          return `
            <div class="empty-state compact">
              <div>
                <div class="empty-title">暂无报告</div>
                <div>采集商品后会自动生成本地分析报告。</div>
              </div>
            </div>
          `;
        }
        const lines = source.split(/\r?\n/);
        let html = "";
        let inList = false;
        const closeList = () => {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
        };
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) {
            closeList();
            continue;
          }
          const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeList();
            const level = heading[1].length;
            html += `<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`;
            continue;
          }
          const listItem = trimmed.match(/^-\s+(.+)$/);
          if (listItem) {
            if (!inList) {
              html += "<ul>";
              inList = true;
            }
            html += `<li>${renderInlineMarkdown(listItem[1])}</li>`;
            continue;
          }
          const quote = trimmed.match(/^>\s?(.+)$/);
          if (quote) {
            closeList();
            html += `<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`;
            continue;
          }
          closeList();
          html += `<p>${renderInlineMarkdown(trimmed)}</p>`;
        }
        closeList();
        return html;
      }

      async function api(path, options = {}) {
        let response;
        try {
          response = await fetch(path, {
            ...options,
            headers: {
              "Content-Type": "application/json",
              ...(options.headers || {}),
            },
          });
        } catch (error) {
          throw new Error(
            "无法连接本机 DealBuddy 服务：请确认 `uv run dealbuddy web` 正在运行，" +
              `且页面端口与服务一致（${error.message}）`
          );
        }
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      }

      function setMessage(message, isError = false) {
        $("page-message").textContent = message;
        $("page-message").className = isError ? "notice error" : "notice";
      }

      function formatPrice(value) {
        return value ? `¥${text(value)}` : "未提取";
      }

      function fieldValue(value, fallback = "未明确") {
        if (Array.isArray(value)) {
          return value.length ? value.join("；") : fallback;
        }
        return text(value, fallback);
      }

      function objectEntries(value) {
        return value && typeof value === "object" && !Array.isArray(value)
          ? Object.entries(value).filter(([, entryValue]) => text(entryValue))
          : [];
      }

      function renderDetailItem(label, value, fallback = "未明确") {
        return `
          <div class="detail-item">
            <span class="detail-label">${escapeHtml(label)}</span>
            <span class="detail-value">${escapeHtml(fieldValue(value, fallback))}</span>
          </div>
        `;
      }

      function renderKeyValueSection(title, entries) {
        if (entries.length === 0) {
          return "";
        }
        return `
          <div class="detail-section">
            <h4>${escapeHtml(title)}</h4>
            <div class="detail-grid">
              ${entries
                .map(([key, value]) => renderDetailItem(key, value))
                .join("")}
            </div>
          </div>
        `;
      }

      function offerToMarkdown(offer, index) {
        const lines = [
          `# 商品 ${index + 1}：${text(offer.title, "未命名商品")}`,
          "",
          `- 平台：${text(offer.platform, "未明确")}`,
          `- 链接：${text(offer.url, "未明确")}`,
          `- 店铺：${text(offer.store_name, "未明确")}`,
          `- 品牌：${text(offer.brand, "未明确")}`,
          `- 型号：${text(offer.model, "未明确")}`,
          `- SKU：${text(offer.sku, "未明确")}`,
          `- 标价：${text(offer.listed_price, "未明确")}`,
          `- 页面展示价：${formatPrice(offer.visible_price)}`,
          `- 估算应付：${formatPrice(offer.estimated_payable)}`,
          `- 优惠：${text(offer.coupon, "未明确")}`,
          `- 优惠条件：${fieldValue(offer.conditions)}`,
          `- 库存：${text(offer.stock, "未明确")}`,
          `- 可信度：${text(offer.confidence, "未明确")}`,
          `- 复核时间：${text(offer.verified_at, "未明确")}`,
        ];
        if (text(offer.llm_summary)) {
          lines.push(`- 优劣短评：${text(offer.llm_summary)}`);
        }
        const specs = objectEntries(offer.specs);
        if (specs.length) {
          lines.push("", "## 规格");
          for (const [key, value] of specs) {
            lines.push(`- ${key}：${value}`);
          }
        }
        const parameters = objectEntries(offer.parameters);
        const parameterLines = parameters.filter(([key]) => key !== "ocr_text");
        if (parameterLines.length) {
          lines.push("", "## 页面参数");
          for (const [key, value] of parameterLines) {
            lines.push(`- ${key}：${value}`);
          }
        }
        if (offer.parameters?.ocr_text) {
          lines.push("", "## OCR 文本", "", "```text", offer.parameters.ocr_text, "```");
        }
        return lines.join("\n");
      }

      async function copyText(value) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      function renderOfferCard(offer, index) {
        const parameters = offer.parameters || {};
        const parameterEntries = objectEntries(parameters).filter(([key]) => key !== "ocr_text");
        const specs = objectEntries(offer.specs);
        const url = safeUrl(offer.url);
        return `
          <details class="offer-card">
            <summary class="offer-summary">
              <span class="offer-headline">
                <a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">
                  ${escapeHtml(text(offer.title, "未命名商品"))}
                </a>
                <span class="muted">${escapeHtml(text(offer.store_name, "店铺未明确"))}</span>
              </span>
              <span class="offer-meta">
                <span class="meta-pill">${escapeHtml(text(offer.platform, "平台未明确"))}</span>
                <span class="meta-pill price">${escapeHtml(formatPrice(offer.visible_price))}</span>
                <span class="meta-pill">SKU ${escapeHtml(text(offer.sku, "未明确"))}</span>
              </span>
            </summary>
            <div class="offer-body">
              ${
                text(offer.llm_summary)
                  ? `<div class="offer-insight">优劣短评：${escapeHtml(text(offer.llm_summary))}</div>`
                  : ""
              }
              <div class="detail-grid">
                ${renderDetailItem("平台", offer.platform)}
                ${renderDetailItem("店铺", offer.store_name)}
                ${renderDetailItem("品牌", offer.brand)}
                ${renderDetailItem("型号", offer.model)}
                ${renderDetailItem("SKU", offer.sku)}
                ${renderDetailItem("页面展示价", formatPrice(offer.visible_price), "未提取")}
                ${renderDetailItem("估算应付", formatPrice(offer.estimated_payable), "未提取")}
                ${renderDetailItem("标价", offer.listed_price)}
                ${renderDetailItem("优惠", offer.coupon)}
                ${renderDetailItem("优惠条件", offer.conditions)}
                ${renderDetailItem("库存", offer.stock)}
                ${renderDetailItem("可信度", offer.confidence)}
                ${renderDetailItem("复核时间", offer.verified_at)}
                ${renderDetailItem("链接", offer.url)}
              </div>
              ${renderKeyValueSection("规格", specs)}
              ${renderKeyValueSection("页面参数", parameterEntries)}
              ${
                parameters.ocr_text
                  ? `<div class="detail-section"><h4>OCR 文本</h4><pre class="text-block">${escapeHtml(parameters.ocr_text)}</pre></div>`
                  : ""
              }
              <div class="inline-actions">
                <button class="secondary" type="button" data-action="copy-offer" data-offer-index="${index}">
                  复制 Markdown
                </button>
                <button class="danger" type="button" data-action="delete-offer" data-offer-index="${index}">
                  删除
                </button>
              </div>
            </div>
          </details>
        `;
      }

      function renderSessions() {
        $("current-status").textContent = `当前会话：${state.currentSessionId || "未选择"}`;
        $("session-list").innerHTML = "";
        if (state.sessions.length === 0) {
          $("session-list").innerHTML = `
            <div class="empty-state compact">
              <div>
                <div class="empty-title">还没有会话</div>
                <div>先输入品类和需求，再用浏览器扩展采集商品。</div>
              </div>
            </div>
          `;
          return;
        }
        for (const session of state.sessions) {
          const button = document.createElement("button");
          const isActive = session.session_id === state.currentSessionId;
          button.type = "button";
          button.className = `session-item ${isActive ? "active" : ""}`;
          button.innerHTML = `
            <strong>${escapeHtml(text(session.requirements.category, "未命名"))}</strong>
            <span class="session-meta">
              <span>${escapeHtml(session.session_id)}</span>
              <span>v${escapeHtml(session.requirements.version)}</span>
            </span>
          `;
          button.addEventListener("click", () => setCurrentSession(session.session_id));
          $("session-list").appendChild(button);
        }
      }

      function scrollMessagesToEnd() {
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function appendChatMessage(message, options = {}) {
        const empty = $("messages").querySelector(".empty-state");
        if (empty) {
          $("messages").innerHTML = "";
        }
        const item = document.createElement("div");
        item.className = `message ${message.role}${options.streaming ? " streaming" : ""}`;
        const role = document.createElement("div");
        role.className = "message-role";
        role.textContent = `${message.role}${message.source ? " / " + message.source : ""}`;
        const content = document.createElement("div");
        content.className = "markdown-content";
        if (message.role === "assistant") {
          content.innerHTML = renderMarkdown(message.content || "");
        } else {
          content.innerHTML = lineBreaks(message.content || "");
        }
        item.append(role, content);
        $("messages").appendChild(item);
        scrollMessagesToEnd();
        return { item, role, content };
      }

      function renderChatMessage(message) {
        appendChatMessage(message);
      }

      function updateChatSubmit() {
        $("chat-submit").disabled = state.chatStreaming;
        $("chat-input").disabled = state.chatStreaming;
      }

      function updateReportActions() {
        const button = $("regenerate-report-button");
        button.disabled = !state.currentSessionId || state.reportRegenerating;
        button.textContent = state.reportRegenerating ? "生成中" : "重新生成";
      }

      async function regenerateReport() {
        if (!state.currentSessionId || state.reportRegenerating) {
          return;
        }
        state.reportRegenerating = true;
        updateReportActions();
        setMessage("正在重新生成报告");
        try {
          const payload = await api(
            `/api/sessions/${state.currentSessionId}/report/regenerate`,
            { method: "POST", body: "{}" },
          );
          state.currentSession = payload.session;
          state.sessions = state.sessions.map((session) =>
            session.session_id === payload.session.session_id ? payload.session : session
          );
          renderSessions();
          renderSessionDetail();
          setMessage("报告已重新生成");
        } catch (error) {
          setMessage(String(error), true);
        } finally {
          state.reportRegenerating = false;
          updateReportActions();
        }
      }

      function parseSseBlock(block) {
        const event = { type: "message", data: "" };
        for (const line of block.split(/\r?\n/)) {
          if (line.startsWith("event:")) {
            event.type = line.slice(6).trim();
          }
          if (line.startsWith("data:")) {
            event.data += line.slice(5).trim();
          }
        }
        return event;
      }

      function handleSseText(buffer, onEvent) {
        const blocks = buffer.split(/\r?\n\r?\n/);
        const rest = blocks.pop() || "";
        for (const block of blocks) {
          if (block.trim()) {
            onEvent(parseSseBlock(block));
          }
        }
        return rest;
      }

      function createTypewriter(target) {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let fullText = "";
        let renderedLength = 0;
        let timer = null;
        let finishResolver = null;

        function render() {
          const remaining = fullText.length - renderedLength;
          if (remaining <= 0) {
            timer = null;
            if (finishResolver) {
              finishResolver();
              finishResolver = null;
            }
            return;
          }
          const step = reducedMotion ? remaining : 2;
          renderedLength += Math.min(step, remaining);
          target.innerHTML = renderMarkdown(fullText.slice(0, renderedLength));
          scrollMessagesToEnd();
          timer = window.setTimeout(render, reducedMotion ? 0 : 18);
        }

        function start() {
          if (!timer) {
            timer = window.setTimeout(render, 0);
          }
        }

        return {
          push(chunk) {
            fullText += chunk;
            start();
          },
          finish() {
            if (fullText.length === renderedLength) {
              return Promise.resolve();
            }
            return new Promise((resolve) => {
              finishResolver = resolve;
              start();
            });
          },
          text() {
            return fullText;
          },
        };
      }

      async function streamChatResponse(content, assistantView) {
        const response = await fetch(`/api/sessions/${state.currentSessionId}/messages/stream`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content }),
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const writer = createTypewriter(assistantView.content);
        const onEvent = (event) => {
          const payload = event.data ? JSON.parse(event.data) : {};
          if (event.type === "delta" && payload.content) {
            writer.push(payload.content);
          }
          if (event.type === "done") {
            assistantView.role.textContent = `assistant / ${payload.source || "local"}`;
          }
        };
        if (!response.body) {
          handleSseText(await response.text(), onEvent);
          await writer.finish();
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          buffer = handleSseText(buffer, onEvent);
        }
        buffer += decoder.decode();
        handleSseText(buffer, onEvent);
        await writer.finish();
      }

      function renderSessionDetail() {
        const session = state.currentSession;
        const offers = session?.verified_offers || [];
        updateReportActions();
        $("offer-count").textContent = `${offers.length} 个商品`;
        $("offer-list").innerHTML = offers.length
          ? offers.map((offer, index) => renderOfferCard(offer, index)).join("")
          : `
            <div class="empty-state">
              <div>
                <div class="empty-title">等待商品投递</div>
                <div>选择当前会话后，在商品详情页使用扩展采集价格、SKU 和规格。</div>
              </div>
            </div>
          `;
        $("report-view").innerHTML = renderMarkdown(session?.report_markdown || "");
        $("messages").innerHTML = "";
        const messages = session?.messages || [];
        if (messages.length === 0) {
          $("messages").innerHTML = `
            <div class="empty-state compact">
              <div>
                <div class="empty-title">还没有追问</div>
                <div>商品进入会话后，可以继续比较、排除和补充偏好。</div>
              </div>
            </div>
          `;
          return;
        }
        for (const message of messages) {
          renderChatMessage(message);
        }
      }

      async function refreshSessions() {
        const health = await api("/api/health");
        $("service-status").textContent = health.status === "ok" ? "服务正常" : "服务异常";
        const payload = await api("/api/sessions");
        state.sessions = payload.sessions || [];
        state.currentSessionId = payload.current_session_id || null;
        renderSessions();
        if (state.currentSessionId) {
          await loadSession(state.currentSessionId);
        } else {
          state.currentSession = null;
          renderSessionDetail();
        }
        await loadLlmStatus();
      }

      async function loadSession(sessionId) {
        const payload = await api(`/api/sessions/${sessionId}`);
        state.currentSession = payload.session;
        state.currentSessionId = sessionId;
        renderSessions();
        renderSessionDetail();
      }

      async function setCurrentSession(sessionId) {
        await api(`/api/sessions/${sessionId}/current`, { method: "POST", body: "{}" });
        await refreshSessions();
      }

      async function deleteOffer(index) {
        if (!state.currentSessionId) {
          setMessage("请先选择或创建会话", true);
          return;
        }
        if (!window.confirm("确定删除这个商品？")) {
          return;
        }
        await api(`/api/sessions/${state.currentSessionId}/offers/${index}`, {
          method: "DELETE",
        });
        await refreshSessions();
        setMessage("商品已删除");
      }

      async function loadLlmStatus() {
        const status = await api("/api/settings/llm");
        const summary = status.configured
          ? `已配置：${status.provider_name} / ${status.model}`
          : status.enabled
            ? "待补全配置"
            : "未启用";
        $("llm-status").textContent = status.configured ? "LLM：已配置" : `LLM：${summary}`;
        $("llm-settings-summary").textContent = summary;
        $("llm-settings-summary").title = summary;
        $("privacy-notice").textContent = status.configured
          ? `外部分析已启用，商品数据可能发送到 ${status.provider_name}。`
          : "默认仅本地分析。开启后只有追问会调用外部 Provider。";
        $("privacy-notice").className = status.configured
          ? "privacy-note warning"
          : "privacy-note";
        $("llm-enabled").checked = Boolean(status.enabled);
        $("llm-provider").value = status.provider_name || "openai-compatible";
        $("llm-base-url").value = status.base_url || "";
        $("llm-model").value = status.model || "";
        // 已配置时不明文展示脱敏预览(placeholder 在 password 框中仍是明文),改用掩码
        $("llm-api-key").placeholder = status.api_key_preview
          ? "••••••••••••"
          : "API Key";
      }

      $("session-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const payload = await api("/api/sessions", {
            method: "POST",
            body: JSON.stringify({
              category: $("category-input").value,
              request: $("request-input").value,
            }),
          });
          state.currentSessionId = payload.current_session_id;
          $("category-input").value = "";
          $("request-input").value = "";
          await refreshSessions();
        } catch (error) {
          setMessage(String(error), true);
        }
      });

      $("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!state.currentSessionId) {
          setMessage("请先选择或创建会话", true);
          return;
        }
        if (state.chatStreaming) {
          return;
        }
        const content = $("chat-input").value.trim();
        if (!content) {
          return;
        }
        state.chatStreaming = true;
        updateChatSubmit();
        appendChatMessage({ role: "user", content });
        $("chat-input").value = "";
        const assistantView = appendChatMessage(
          { role: "assistant", content: "", source: "生成中" },
          { streaming: true },
        );
        try {
          await streamChatResponse(content, assistantView);
          assistantView.item.classList.remove("streaming");
          await loadSession(state.currentSessionId);
        } catch (error) {
          assistantView.item.classList.remove("streaming");
          assistantView.role.textContent = "assistant / error";
          assistantView.content.innerHTML = lineBreaks(String(error));
          setMessage(String(error), true);
        } finally {
          state.chatStreaming = false;
          updateChatSubmit();
        }
      });

      $("llm-test-button").addEventListener("click", async () => {
        const result = $("llm-test-result");
        const button = $("llm-test-button");
        button.disabled = true;
        result.className = "notice";
        result.textContent = "正在测试连接…";
        try {
          const payload = await api("/api/settings/llm/test", {
            method: "POST",
            body: JSON.stringify({
              provider_name: $("llm-provider").value,
              base_url: $("llm-base-url").value,
              model: $("llm-model").value,
              api_key: $("llm-api-key").value,
            }),
          });
          result.className = payload.ok ? "notice" : "notice error";
          result.textContent = payload.endpoint
            ? `${payload.message}（${payload.endpoint}）`
            : payload.message;
        } catch (error) {
          result.className = "notice error";
          result.textContent = String(error.message || error);
        } finally {
          button.disabled = false;
        }
      });

      $("llm-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await api("/api/settings/llm", {
            method: "POST",
            body: JSON.stringify({
              enabled: $("llm-enabled").checked,
              provider_name: $("llm-provider").value,
              base_url: $("llm-base-url").value,
              model: $("llm-model").value,
              api_key: $("llm-api-key").value,
            }),
          });
          $("llm-api-key").value = "";
          await loadLlmStatus();
          setMessage("设置已保存");
        } catch (error) {
          setMessage(String(error), true);
        }
      });

      $("offer-list").addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) {
          return;
        }
        const index = Number(button.dataset.offerIndex);
        const offer = state.currentSession?.verified_offers?.[index];
        try {
          if (button.dataset.action === "copy-offer" && offer) {
            await copyText(offerToMarkdown(offer, index));
            setMessage("商品 Markdown 已复制");
          }
          if (button.dataset.action === "delete-offer") {
            await deleteOffer(index);
          }
        } catch (error) {
          setMessage(String(error), true);
        }
      });

      $("refresh-button").addEventListener("click", () => {
        refreshSessions().catch((error) => setMessage(String(error), true));
      });

      $("regenerate-report-button").addEventListener("click", () => {
        regenerateReport().catch((error) => setMessage(String(error), true));
      });

      // 实时同步：扩展采集商品后，工作台自动刷新当前会话，无需手动点"刷新"。
      // 仅在页面可见、非流式回答、无表单输入焦点时比对；有变化才重渲染。
      const LIVE_SYNC_INTERVAL_MS = 4000;
      const LIVE_SYNC_SKIP_FOCUS_IDS = new Set([
        "chat-input",
        "category-input",
        "request-input",
      ]);

      function sessionSyncKey(session) {
        if (!session) {
          return "";
        }
        const offerCount = (session.verified_offers || []).length;
        const messageCount = (session.messages || []).length;
        return `${session.updated_at}|${offerCount}|${messageCount}`;
      }

      async function liveSyncCurrentSession(force = false) {
        if (!force && document.visibilityState !== "visible") {
          return;
        }
        if (state.chatStreaming || state.reportRegenerating) {
          return;
        }
        if (LIVE_SYNC_SKIP_FOCUS_IDS.has(document.activeElement?.id)) {
          return;
        }
        if (!state.currentSessionId) {
          return;
        }
        try {
          const payload = await api(`/api/sessions/${state.currentSessionId}`);
          const next = payload.session;
          const nextKey = sessionSyncKey(next);
          const currentKey = sessionSyncKey(state.currentSession);
          if (nextKey === currentKey) {
            return;
          }
          const previousCount = (state.currentSession?.verified_offers || []).length;
          state.currentSession = next;
          renderSessionDetail();
          const nextCount = (next.verified_offers || []).length;
          if (nextCount > previousCount) {
            setMessage(`已同步 ${nextCount - previousCount} 个新采集商品`);
          }
        } catch (_error) {
          // 轮询失败静默跳过，下一轮重试；手动"刷新"仍会显示错误。
        }
      }

      window.setInterval(() => liveSyncCurrentSession(), LIVE_SYNC_INTERVAL_MS);

      // 从商品页切回工作台时立即同步一次，不必等下一个轮询周期。
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          liveSyncCurrentSession(true);
        }
      });

      refreshSessions().catch((error) => setMessage(String(error), true));
    </script>
  </body>
</html>
