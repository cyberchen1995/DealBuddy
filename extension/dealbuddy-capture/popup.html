<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DealBuddy 购物搭子</title>
    <link rel="stylesheet" href="tokens.css">
    <style>
      /* 柔和亲和风:token 来自 tokens.css(与工作台同步),此处只写组件样式。
         color-scheme 是文档级配置,由本文档自理(tokens.css 为纯变量文件,
         注入电商宿主页时不得改写宿主配色方案)。 */
      :root {
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        background: var(--db-bg);
        color: var(--db-text);
        font-family: var(--db-font-body);
        font-size: 13.5px;
        line-height: 1.55;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 14px;
        color: var(--db-muted-strong);
        font-size: 12px;
        line-height: 1.5;
      }

      .card {
        background: var(--db-surface);
        border-radius: var(--db-radius-s);
        box-shadow: 0 6px 18px var(--db-shadow), 0 0 0 1px var(--db-ring);
        padding: 14px;
      }

      .card + .card {
        margin-top: 12px;
      }

      .section-title {
        margin: 0 0 10px;
        color: var(--db-text);
        font-size: 13px;
        font-weight: 600;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--db-muted-strong);
        font-size: 12.5px;
        font-weight: 600;
      }

      input[type="checkbox"] {
        accent-color: var(--db-accent);
        width: 16px;
        height: 16px;
      }

      input[type="number"],
      input[type="url"] {
        width: 84px;
        border: 2px solid var(--db-surface-soft);
        border-radius: 10px;
        padding: 6px 10px;
        background: var(--db-surface-soft);
        color: var(--db-text);
        font: inherit;
        font-size: 12.5px;
        transition: border-color 200ms ease, background-color 200ms ease;
      }

      input[type="url"] {
        width: 100%;
        margin-top: 8px;
      }

      input[type="number"]:hover,
      input[type="url"]:hover {
        border-color: var(--db-line-strong);
      }

      input[type="number"]:focus-visible,
      input[type="url"]:focus-visible {
        outline: none;
        border-color: var(--db-accent);
        background: var(--db-surface);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: var(--db-accent);
        color: var(--db-on-accent);
        cursor: pointer;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        box-shadow: 0 3px 10px var(--db-shadow);
        transition:
          background-color 200ms ease,
          color 200ms ease,
          box-shadow 200ms ease,
          transform 200ms ease;
      }

      button:hover:not(:disabled) {
        background: var(--db-accent-strong);
        box-shadow: 0 6px 14px var(--db-shadow-deep);
        transform: translateY(-1px);
      }

      button:active:not(:disabled) {
        transform: none;
        box-shadow: 0 2px 6px var(--db-shadow);
      }

      button:focus-visible {
        outline: 2px solid var(--db-accent-strong);
        outline-offset: 2px;
      }

      button.secondary {
        background: var(--db-surface-soft);
        color: var(--db-muted-strong);
        box-shadow: none;
      }

      button.secondary:hover:not(:disabled) {
        background: var(--db-line);
        color: var(--db-text);
      }

      button:disabled {
        background: var(--db-surface-soft);
        color: var(--db-muted);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
        opacity: 0.7;
      }

      .field-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .button-row .primary {
        grid-column: 1 / -1;
      }

      .hint,
      .status,
      .summary,
      .warning-list {
        margin: 0;
        color: var(--db-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .status {
        min-height: 18px;
      }

      .status.ok {
        color: var(--db-accent-strong);
      }

      .status.error {
        color: var(--db-danger-strong);
      }

      .summary {
        margin: 8px 0 10px;
        color: var(--db-muted-strong);
      }

      .warning-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }

      .warning {
        border-radius: 10px;
        padding: 7px 10px;
        background: var(--db-warn-soft);
        color: var(--db-warn-strong);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }

        button:hover:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>DealBuddy 购物搭子</h1>
    <p class="subtitle">采集当前商品事实，发送到本地 DealBuddy 会话辅助购物决策。</p>

    <section class="card" aria-labelledby="settings-title">
      <h2 id="settings-title" class="section-title">配置</h2>
      <form id="dealbuddy-settings-form">
        <label>
          <input id="auto-capture-enabled" type="checkbox">
          启用自动采集
        </label>

        <div>
          <label for="intake-url">Intake URL</label>
          <input
            id="intake-url"
            type="url"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
          >
          <p class="hint">默认：http://127.0.0.1:8765/api/current/offers</p>
        </div>

        <div>
          <div class="field-row">
            <label for="detail-load-timeout-seconds">详情图加载等待超时</label>
            <input
              id="detail-load-timeout-seconds"
              type="number"
              min="5"
              max="60"
              step="1"
              inputmode="numeric"
            >
          </div>
          <p class="hint">单位：秒，范围 5-60，默认 12。</p>
        </div>

        <p id="settings-status" class="status ok" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="capture-title">
      <h2 id="capture-title" class="section-title">当前页整理</h2>
      <p id="capture-status" class="status" role="status" aria-live="polite">
        正在连接当前页面...
      </p>
      <p id="payload-summary" class="summary"></p>
      <div class="button-row">
        <button id="capture-current-button" class="primary" type="button">
          整理当前商品信息
        </button>
        <button id="copy-json-button" class="secondary" type="button" disabled>
          复制 JSON
        </button>
        <button id="recapture-button" class="secondary" type="button" disabled>
          重新整理
        </button>
      </div>
      <div id="warning-list" class="warning-list" aria-live="polite"></div>
    </section>

    <script src="settings-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
